<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Ubicon settings</title></head>
  <body style="font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem;">
    <h1 style="font-size: 18px;">Ubicon settings</h1>
    <h2 style="font-size: 14px;">Local UniFi controllers</h2>
    <p style="font-size: 13px; color: #6b7280;">
      unifi.ui.com works out of the box. To use Ubicon on a local console
      (UDM, Cloud Key, self-hosted), add its address; your browser will ask
      you to grant access to that site.
    </p>
    <form id="add" style="display: flex; gap: 8px;">
      <input id="url" type="url" required placeholder="https://192.168.1.1" style="flex: 1; padding: 7px 10px;" />
      <button style="padding: 7px 14px;">Add</button>
    </form>
    <p id="msg" style="font-size: 12px; color: #6b7280;"></p>
    <ul id="origins" style="font-size: 13px; padding-left: 1.2em;"></ul>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
