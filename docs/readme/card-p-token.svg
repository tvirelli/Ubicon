<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="386" height="176" viewBox="0 0 386 176" role="img" aria-label="Tokens are scoped to one repo. Ubicon refuses any token that can reach another repository in your account.">
<title>Tokens are scoped to one repo. Ubicon refuses any token that can reach another repository in your account.</title>
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.i{stroke-dasharray:80;stroke-dashoffset:80;animation:draw 1.2s ease-out .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
</style>

<rect x="0.5" y="0.5" width="385" height="175" rx="14" fill="#1D212E" stroke="#2B3040"/>
<rect x="24" y="24" width="40" height="40" rx="10" fill="rgba(139,114,232,0.12)" stroke="rgba(139,114,232,0.28)"/>
<g class="i" transform="translate(32 32)" fill="none" stroke="#A292F2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9"/><path d="m17 6 2 2"/><path d="m14 9 2 2"/></g>
<text x="24" y="98" font-family="IBM Plex Sans" font-weight="600" font-size="18" letter-spacing="-0.2" fill="#E7EAF4">Tokens are scoped to one repo</text>
<text x="24" y="124" font-family="IBM Plex Sans" font-size="14.5" fill="#9AA1B8">Ubicon refuses any token that can reach</text>
<text x="24" y="146" font-family="IBM Plex Sans" font-size="14.5" fill="#9AA1B8">another repository in your account.</text>
</svg>
