<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="128" viewBox="0 0 1200 128" role="img" aria-label="PRIVACY AND TRUST. Overlay only. Never your settings, never your data.">
<title>PRIVACY AND TRUST. Overlay only. Never your settings, never your data.</title>
<style>
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"Archivo";font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.rule{transform-origin:0 0;animation:sweep 1.1s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}

</style>

<rect width="1200" height="128" fill="#12141C" rx="14"/>
<rect x="0.5" y="0.5" width="1199" height="127" fill="none" stroke="#2B3040" rx="14"/>
<rect class="rule" x="28" y="30" width="34" height="2" fill="#8B72E8"/>
<text x="74" y="35.5" font-family="IBM Plex Mono" font-size="12" letter-spacing="2" fill="#A292F2">PRIVACY AND TRUST</text>
<text x="28" y="90" font-family="Archivo" font-weight="700" font-size="40" letter-spacing="-1.2" fill="#E7EAF4">Overlay only. Never your settings, never your data.</text>
</svg>
