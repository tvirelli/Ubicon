<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="386" height="176" viewBox="0 0 386 176" role="img" aria-label="Custom icons stay local. Your uploads live in the browser. Export a backup, or use GitHub sync, to move them.">
<title>Custom icons stay local. Your uploads live in the browser. Export a backup, or use GitHub sync, to move them.</title>
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
