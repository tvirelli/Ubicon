<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-label="Ubicon. Custom device icons for UniFi. Open source, MIT licensed, built by Tony Virelli.">
<title>Ubicon. Custom device icons for UniFi. Open source, MIT licensed, built by Tony Virelli.</title>
<style>
@font-face{font-family:"Archivo";font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.glow{animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.55}to{opacity:1}}
</style>

<defs>
  <radialGradient id="g" gradientUnits="userSpaceOnUse" cx="600" cy="236" r="560">
    <stop offset="0" stop-color="#5B3FD1" stop-opacity=".6"/>
    <stop offset="1" stop-color="#5B3FD1" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  </pattern>
  <clipPath id="r"><rect width="1200" height="236" rx="16"/></clipPath>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="236" fill="#12141C"/>
  <rect width="1200" height="236" fill="url(#grid)"/>
  <rect class="glow" width="1200" height="236" fill="url(#g)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="235" rx="16" fill="none" stroke="#2B3040"/>
<g transform="translate(472 58) scale(0.5)">
  <path d="M23 30 V86 A19 19 0 0 0 42 105 H86 A19 19 0 0 0 105 86 V52" fill="none" stroke="#8B72E8" stroke-width="14" stroke-linecap="round" pathLength="1"/>
  <rect x="98" y="23" width="14" height="14" rx="4" fill="#8B72E8"/>
  <rect x="44" y="44" width="40" height="40" rx="10" fill="#8B72E8"/>
</g>
<text x="634" y="112" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="60" letter-spacing="-2.2" fill="#E7EAF4">Ubicon</text>
<text x="600" y="164" text-anchor="middle" font-family="IBM Plex Sans" font-size="17" fill="#E7EAF4">Custom device icons for UniFi.</text>
<text x="600" y="192" text-anchor="middle" font-family="IBM Plex Sans" font-size="15" fill="#9AA1B8">Open source, MIT licensed, built by Tony Virelli.</text>
</svg>
