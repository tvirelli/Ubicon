<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Ubicon footer">
<title>Ubicon footer</title>
<style>
@font-face{font-family:"Archivo";font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.glow{animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.5}to{opacity:1}}
</style>

<defs>
  <radialGradient id="g" cx="0%" cy="100%" r="70%"><stop offset="0" stop-color="#5B3FD1" stop-opacity=".5"/><stop offset="1" stop-color="#5B3FD1" stop-opacity="0"/></radialGradient>
  <clipPath id="r"><rect width="1200" height="200" rx="16"/></clipPath>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="200" fill="#12141C"/>
  <rect class="glow" width="1200" height="200" fill="url(#g)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="199" rx="16" fill="none" stroke="#2B3040"/>
<g transform="translate(36 40) scale(0.3125)">
  <path d="M23 30 V86 A19 19 0 0 0 42 105 H86 A19 19 0 0 0 105 86 V52" fill="none" stroke="#8B72E8" stroke-width="14" stroke-linecap="round" pathLength="1"/>
  <rect x="98" y="23" width="14" height="14" rx="4" fill="#8B72E8"/>
  <rect x="44" y="44" width="40" height="40" rx="10" fill="#8B72E8"/>
</g>
<text x="88" y="70" font-family="Archivo" font-weight="700" font-size="24" letter-spacing="-0.6" fill="#E7EAF4">Ubicon</text>
<text x="36" y="112" font-family="IBM Plex Sans" font-size="14.5" fill="#9AA1B8">Custom device icons for UniFi. Open source, MIT licensed, built by Tony Virelli.</text>
<text x="640" y="52" font-family="IBM Plex Mono" font-size="11" letter-spacing="1.8" fill="#9AA1B8">PRODUCT</text><text x="640" y="84" font-family="IBM Plex Sans" font-size="14.5" fill="#E7EAF4">Website</text><text x="640" y="110" font-family="IBM Plex Sans" font-size="14.5" fill="#E7EAF4">GitHub sync guide</text><text x="640" y="136" font-family="IBM Plex Sans" font-size="14.5" fill="#E7EAF4">Privacy policy</text><text x="830" y="52" font-family="IBM Plex Mono" font-size="11" letter-spacing="1.8" fill="#9AA1B8">OPEN SOURCE</text><text x="830" y="84" font-family="IBM Plex Sans" font-size="14.5" fill="#E7EAF4">Extension repo</text><text x="830" y="110" font-family="IBM Plex Sans" font-size="14.5" fill="#E7EAF4">Device database</text><text x="830" y="136" font-family="IBM Plex Sans" font-size="14.5" fill="#E7EAF4">Releases</text><text x="1020" y="52" font-family="IBM Plex Mono" font-size="11" letter-spacing="1.8" fill="#9AA1B8">CONTACT</text><text x="1020" y="84" font-family="IBM Plex Sans" font-size="14.5" fill="#E7EAF4">Issues</text><text x="1020" y="110" font-family="IBM Plex Sans" font-size="14.5" fill="#E7EAF4">tonyvirelli.com</text>
</svg>
